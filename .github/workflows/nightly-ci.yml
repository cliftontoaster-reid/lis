name: Nightly CI

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: Schedule gate
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
      - id: gate
        shell: bash
        run: |
          set -euo pipefail
          event_name='${{ github.event_name }}'
          if [ "$event_name" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual run" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_commit="$(git log -1 --format=%ct)"
          now="$(date -u +%s)"
          age_days=$(( (now - latest_commit) / 86400 ))
          weekday="$(date -u +%u)"

          if [ "$age_days" -lt 7 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=recent commits found ($age_days days old)" >> "$GITHUB_OUTPUT"
          elif [ "$weekday" = "7" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reason=weekly stale run" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reason=no recent commits and not the weekly run day" >> "$GITHUB_OUTPUT"
          fi

  linux-nightly:
    name: Linux nightly
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: ./scripts/install-linux.sh
      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-junit junit.xml --output-on-failure

  linux-distros:
    name: Linux distro (${{ matrix.name }})
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debian
            image: debian:13
            bootstrap: apt-get update && apt-get install -y git bash
          - name: Fedora
            image: fedora:44
            bootstrap: dnf install -y git bash
          - name: Arch
            image: archlinux:base-devel
            bootstrap: pacman -Sy --noconfirm && pacman -S --noconfirm --needed git bash
          - name: Alpine
            image: alpine:3.24
            bootstrap: apk add --no-cache git bash
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Bootstrap git/bash for checkout
        shell: sh
        run: ${{ matrix.bootstrap }}
      - uses: actions/checkout@v7
      - name: Install dependencies
        shell: bash
        run: ./scripts/install-linux.sh
      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: bash
        run: cmake --build build
      - name: Test
        shell: bash
        run: ctest --test-dir build --output-junit junit.xml --output-on-failure

  macos:
    name: macOS nightly
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: ./scripts/install-macos.sh
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR="$(brew --prefix openssl)"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-junit junit.xml --output-on-failure

  windows-msvc:
    name: Windows MSVC nightly
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install dependencies
        shell: pwsh
        run: .\scripts\install-windows.ps1
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_INSTALLED_DIR="$env:VCPKG_INSTALLED_DIR"
      - name: Build
        shell: pwsh
        run: cmake --build build
      - name: Test
        shell: pwsh
        run: ctest --test-dir build --output-junit junit.xml --output-on-failure

  windows-mingw:
    name: Windows MinGW nightly
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
      - name: Install dependencies
        shell: msys2 {0}
        run: bash ./scripts/install-msys2.sh
      - name: Configure
        shell: msys2 {0}
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR=/mingw64
      - name: Build
        shell: msys2 {0}
        run: cmake --build build
      - name: Test
        shell: msys2 {0}
        run: ctest --test-dir build --output-junit junit.xml --output-on-failure

  freebsd:
    name: FreeBSD nightly
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: pkg install -y git bash
          run: |
            set -euo pipefail
            ./scripts/install-freebsd.sh
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
            cmake --build build
            ctest --test-dir build --output-junit junit.xml --output-on-failure

  android:
    name: Android nightly
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: ./scripts/install-android.sh
      - name: Verify Android toolchain
        run: test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
